services:
  # 1. Database
  postgres:
    image: postgres:16-alpine
    container_name: nearnow_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nearnow_db}
    # Not published on the host: only containers on this network reach the database.
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  # 2. Redis
  redis:
    image: redis:7-alpine
    container_name: nearnow_redis
    restart: always
    volumes:
      - redis_data_prod:/data

  # 3. Backend API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nearnow_api
    restart: always
    volumes:
      - uploads_data_prod:/app/uploads # Persist uploads (Matches Dockerfile WORKDIR /app)
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nearnow_db}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3002
      NODE_ENV: production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      UPLOAD_DIR: /app/uploads
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    depends_on:
      - postgres
      - redis

  # 4. Frontend Web
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3002}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: nearnow_web
    restart: always
    environment:
      # In Docker, we talk to Nginx or directly to API internal URL
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      INTERNAL_API_URL: http://api:3002 # Server side sees this
    depends_on:
      - api

  # 5. Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: nearnow_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - uploads_data_prod:/var/www/uploads # Map volume to Nginx for serving
    depends_on:
      - web
      - api

  # 6. Certbot (SSL Certificates)
  certbot:
    image: certbot/certbot
    container_name: nearnow_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  postgres_data_prod:
  redis_data_prod:
  uploads_data_prod:
